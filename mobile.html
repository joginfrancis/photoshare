<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>PhotoShare</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: #fff;
      color: #1a1a1a;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Top bar ── */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.5rem;
      flex-shrink: 0;
      border-bottom: 1px solid #f0f0f0;
    }
    .wordmark { font-size: 1rem; font-weight: 600; color: #aaa; }

    /* ── Status chip ── */
    #chip {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.4rem 1rem;
      border-radius: 100px;
      font-size: 0.82rem;
      font-weight: 600;
      background: #f4f4f4;
      color: #999;
      transition: background 0.3s, color 0.3s;
    }
    .dot  { width: 8px; height: 8px; border-radius: 50%; background: #ccc; flex-shrink: 0; }
    .ring {
      width: 14px; height: 14px;
      border: 2.5px solid #ddd;
      border-top-color: #1a73e8;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0; display: none;
    }
    #chip.connecting .dot  { display: none; }
    #chip.connecting .ring { display: block; }
    #chip.connected  { background: #e6f4ea; color: #1a7a35; }
    #chip.connected  .dot { background: #34a853; }
    #chip.sending    { background: #e8f0fe; color: #1a73e8; }
    #chip.sending    .dot { background: #1a73e8; animation: pulse 1s ease-in-out infinite; }
    #chip.done       { background: #e6f4ea; color: #1a7a35; }
    #chip.done       .dot { background: #34a853; }
    #chip.error      { background: #fce8e6; color: #c5221f; }
    #chip.error      .dot { background: #ea4335; }

    @keyframes spin  { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

    /* ── Stage ── */
    .stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 2rem 220px; /* bottom pad reserves space for fixed dock; JS refines */
      overflow: hidden;
    }

    /* Connecting */
    #v-connecting {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      text-align: center;
    }
    .big-ring {
      width: 56px; height: 56px;
      border: 4px solid #eee;
      border-top-color: #1a73e8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    #v-connecting h2 { font-size: 1.4rem; font-weight: 600; color: #333; }
    #v-connecting p  { font-size: 0.95rem; color: #aaa; }

    /* Ready */
    #v-ready {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      text-align: center;
    }
    .ready-icon {
      width: 130px; height: 130px;
      background: #f0f4ff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .ready-icon svg { width: 64px; height: 64px; fill: #1a73e8; }
    #v-ready h1 {
      font-size: 2rem;
      font-weight: 700;
      line-height: 1.2;
      color: #1a1a1a;
    }
    #v-ready p {
      font-size: 1rem;
      color: #999;
      line-height: 1.6;
      max-width: 280px;
    }

    /* Preview */
    #v-preview {
      display: none;
      width: 100%;
      flex: 1;
      border-radius: 1.25rem;
      overflow: hidden;
      box-shadow: 0 4px 24px #00000014;
    }
    #v-preview img { width: 100%; height: 100%; object-fit: cover; display: block; }

    /* ── Dock — fixed, floating above content ── */
    .dock {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 10;
      background: #fff;
      box-shadow: 0 -1px 12px #00000010;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      padding: 1.25rem 1.5rem;
      padding-bottom: max(1.5rem, env(safe-area-inset-bottom));
      transform-origin: bottom left; /* for zoom compensation */
    }

    /* Progress */
    #prog-wrap {
      display: none;
      height: 4px;
      background: #eee;
      border-radius: 2px;
      overflow: hidden;
    }
    #prog-bar {
      height: 100%;
      width: 0;
      background: #1a73e8;
      transition: width 0.1s;
    }

    /* File size */
    #file-sz {
      display: none;
      text-align: center;
      font-size: 0.85rem;
      font-weight: 500;
      color: #bbb;
    }

    /* ── Primary button ── */
    .btn-blue {
      width: 100%;
      min-height: 76px;
      border: none;
      border-radius: 100px;
      background: #1a73e8;
      color: #fff;
      font-size: 6rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      letter-spacing: 0.01em;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.1s, background 0.15s;
      box-shadow: 0 4px 16px #1a73e830;
    }
    .btn-blue svg { width: 32px; height: 32px; fill: #fff; flex-shrink: 0; }
    .btn-blue:active:not(:disabled) { transform: scale(0.97); background: #1558d6; }
    .btn-blue:disabled { opacity: 0.35; cursor: not-allowed; box-shadow: none; }

    /* ── Ghost button ── */
    .btn-ghost {
      width: 100%;
      min-height: 50px;
      border: none;
      background: transparent;
      color: #1a73e8;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-ghost:active { opacity: 0.6; }

    /* ── Responsive ── */
    @media (min-height: 700px) {
      .ready-icon          { width: 150px; height: 150px; }
      .ready-icon svg      { width: 76px; height: 76px; }
      #v-ready h1          { font-size: 2.25rem; }
      .btn-blue            { min-height: 80px; font-size: 6rem; }
      .btn-blue svg        { width: 34px; height: 34px; }
      .dock                { gap: 0.85rem; padding: 1.5rem 1.75rem; padding-bottom: max(1.75rem, env(safe-area-inset-bottom)); }
    }
    @media (min-height: 800px) {
      .ready-icon          { width: 170px; height: 170px; }
      .ready-icon svg      { width: 86px; height: 86px; }
      #v-ready h1          { font-size: 2.5rem; }
      #v-ready p           { font-size: 1.05rem; }
      .btn-blue            { min-height: 86px; font-size: 6rem; }
      .btn-blue svg        { width: 36px; height: 36px; }
      .dock                { padding: 1.75rem 2rem; padding-bottom: max(2rem, env(safe-area-inset-bottom)); }
      .topbar              { padding: 1.25rem 2rem; }
    }
    @media (min-width: 400px) {
      .topbar, .dock { padding-left: 2rem; padding-right: 2rem; }
    }
  </style>
</head>
<body>

  <div class="topbar">
    <span class="wordmark">PhotoShare</span>
    <div id="chip" class="connecting">
      <div class="ring"></div>
      <div class="dot"></div>
      <span id="chip-text">Connecting</span>
    </div>
  </div>

  <div class="stage" id="stage">

    <!-- Connecting -->
    <div id="v-connecting">
      <div class="big-ring"></div>
      <h2>Connecting…</h2>
      <p>Reaching your desktop</p>
    </div>

    <!-- Ready -->
    <div id="v-ready">
      <div class="ready-icon">
        <svg viewBox="0 0 24 24"><path d="M9 3L7.17 5H4C2.9 5 2 5.9 2 7v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2h-3.17L15 3H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg>
      </div>
      <h1>Ready to capture</h1>
      <p>Tap the button and point your camera at what you want to send</p>
    </div>

    <!-- Preview -->
    <div id="v-preview">
      <img id="preview" alt="">
    </div>

  </div>

  <input type="file" id="camera-input" accept="image/*" capture="environment" style="display:none">

  <div class="dock">
    <div id="prog-wrap"><div id="prog-bar"></div></div>
    <span id="file-sz"></span>

    <button class="btn-blue" id="capture-btn" disabled>
      <svg viewBox="0 0 24 24"><path d="M9 3L7.17 5H4C2.9 5 2 5.9 2 7v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2h-3.17L15 3H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg>
      Capture
    </button>

    <button class="btn-blue" id="send-btn"    style="display:none" disabled>Send Photo</button>
    <button class="btn-ghost" id="retake-btn" style="display:none">Retake</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script>
  (() => {
    const chip        = document.getElementById('chip');
    const chipText    = document.getElementById('chip-text');
    const vConn       = document.getElementById('v-connecting');
    const vReady      = document.getElementById('v-ready');
    const vPreview    = document.getElementById('v-preview');
    const preview     = document.getElementById('preview');
    const captureBtn  = document.getElementById('capture-btn');
    const sendBtn     = document.getElementById('send-btn');
    const retakeBtn   = document.getElementById('retake-btn');
    const camInput    = document.getElementById('camera-input');
    const progWrap    = document.getElementById('prog-wrap');
    const progBar     = document.getElementById('prog-bar');
    const fileSz      = document.getElementById('file-sz');
    const stage       = document.getElementById('stage');

    const CHUNK = 16 * 1024;
    let conn, selectedFile;

    function setChip(text, cls) { chipText.textContent = text; chip.className = cls; }

    const desktopId = new URLSearchParams(location.search).get('id');
    if (!desktopId) {
      setChip('Invalid link', 'error');
      vConn.querySelector('h2').textContent = 'Invalid link';
      vConn.querySelector('p').textContent  = 'Rescan the QR code.';
      return;
    }

    const ICE = [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' },
      { urls: 'stun:stun.cloudflare.com:3478' },
      { urls: 'turn:openrelay.metered.ca:80',
        username: 'openrelayproject', credential: 'openrelayproject' },
      { urls: 'turn:openrelay.metered.ca:443',
        username: 'openrelayproject', credential: 'openrelayproject' },
      { urls: 'turn:openrelay.metered.ca:443?transport=tcp',
        username: 'openrelayproject', credential: 'openrelayproject' },
    ];

    const peer = new Peer({ config: { iceServers: ICE } });
    peer.on('error', () => setChip('Error', 'error'));

    peer.on('open', () => {
      setChip('Calling…', 'connecting');
      conn = peer.connect(desktopId, { reliable: true, serialization: 'binary' });

      conn.on('open', () => {
        setChip('Connected', 'connected');
        vConn.style.display  = 'none';
        vReady.style.display = 'flex';
        captureBtn.disabled  = false;
      });
      conn.on('error', () => { setChip('Lost', 'error'); captureBtn.disabled = true; });
      conn.on('close',  () => { setChip('Disconnected', 'error'); captureBtn.disabled = true; });
    });

    captureBtn.onclick = () => camInput.click();
    retakeBtn.onclick  = () => { camInput.value = ''; camInput.click(); };

    camInput.onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      selectedFile = file;
      preview.src = URL.createObjectURL(file);

      vReady.style.display    = 'none';
      vPreview.style.display  = 'block';
      stage.style.paddingTop  = '1rem';
      stage.style.paddingLeft = stage.style.paddingRight = '1rem';
      /* paddingBottom is kept at dock height — managed by syncDock */

      captureBtn.style.display = 'none';
      fileSz.style.display     = 'block';
      fileSz.textContent       = (file.size / 1024).toFixed(0) + ' KB';
      sendBtn.style.display    = 'block';
      retakeBtn.style.display  = 'block';
      sendBtn.disabled         = false;
      sendBtn.textContent      = 'Send Photo';
    };

    sendBtn.onclick = async () => {
      if (!selectedFile || !conn?.open) return;
      sendBtn.disabled   = true;
      retakeBtn.disabled = true;
      progWrap.style.display = 'block';
      progBar.style.width    = '0%';
      setChip('Sending…', 'sending');

      const buf = await selectedFile.arrayBuffer();
      conn.send(JSON.stringify({
        type: 'meta', name: selectedFile.name,
        size: buf.byteLength, mime: selectedFile.type,
      }));

      const dc = conn.dataChannel;
      let offset = 0;
      while (offset < buf.byteLength) {
        while (dc && dc.bufferedAmount > 512 * 1024)
          await new Promise(r => setTimeout(r, 20));
        const end = Math.min(offset + CHUNK, buf.byteLength);
        conn.send(buf.slice(offset, end));
        offset = end;
        progBar.style.width = Math.round(offset / buf.byteLength * 100) + '%';
      }
      conn.send(JSON.stringify({ type: 'done', name: selectedFile.name, mime: selectedFile.type }));

      setChip('Sent ✓', 'done');
      progWrap.style.display = 'none';
      sendBtn.textContent    = 'Send Another';
      sendBtn.disabled       = false;
      retakeBtn.disabled     = false;
    };

    // ── Floating dock: fixed position + zoom-resistant ──────────────────────
    const dockEl = document.querySelector('.dock');

    function syncDock() {
      const vv = window.visualViewport;
      if (!vv) return;
      const s = vv.scale;
      // Counteract zoom so the dock keeps its original visual size
      dockEl.style.transform = `scale(${1 / s})`;
      // Anchor to the visual viewport (not the layout viewport)
      dockEl.style.left   = vv.offsetLeft + 'px';
      dockEl.style.width  = window.innerWidth + 'px';
      dockEl.style.bottom = Math.max(0, window.innerHeight - vv.offsetTop - vv.height) + 'px';
      // Keep stage bottom padding == visual dock height so content isn't hidden
      stage.style.paddingBottom = (dockEl.offsetHeight / s) + 'px';
    }

    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', syncDock);
      window.visualViewport.addEventListener('scroll', syncDock);
    }
    requestAnimationFrame(syncDock); // run once after first paint
  })();
  </script>
</body>
</html>
