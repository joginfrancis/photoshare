<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>PhotoShare – Send</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #111; color: #f0f0f0;
      min-height: 100dvh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 2rem 1.5rem; gap: 1rem; text-align: center;
    }
    h1   { font-size: 1.5rem; font-weight: 700; }
    .sub { color: #555; font-size: 0.85rem; }

    #status {
      font-size: 0.88rem; padding: 0.4rem 1.1rem;
      border-radius: 2rem; background: #1e1e1e; color: #aaa;
      transition: all 0.3s;
    }
    #status.ready   { background: #0f2a1a; color: #4ade80; }
    #status.error   { background: #2a0f0f; color: #f87171; }
    #status.sending { background: #0f1e2a; color: #60a5fa; }
    #status.done    { background: #0f2a1a; color: #4ade80; }
    #status.spin::before {
      content: '⟳ '; display: inline-block;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #preview {
      width: 100%; max-width: 320px; border-radius: 1rem;
      display: none; box-shadow: 0 4px 24px #0009; object-fit: cover;
    }

    .btn-row {
      display: none;
      gap: 0.75rem; width: 100%; max-width: 320px;
    }
    .btn {
      flex: 1; padding: 1rem 0.5rem; border: none;
      border-radius: 0.85rem; font-size: 0.95rem; font-weight: 700;
      cursor: pointer; transition: opacity 0.2s;
      display: flex; flex-direction: column;
      align-items: center; gap: 0.3rem;
    }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn .icon { font-size: 1.6rem; }
    #camera-btn  { background: #3b82f6; color: #fff; }
    #gallery-btn { background: #6366f1; color: #fff; }
    #send-btn {
      display: none; width: 100%; max-width: 320px;
      padding: 1rem; border: none; border-radius: 0.85rem;
      font-size: 1.05rem; font-weight: 700;
      background: #4ade80; color: #000; cursor: pointer;
    }
    #send-btn:disabled { opacity: 0.35; cursor: not-allowed; }

    #progress-wrap {
      width: 100%; max-width: 320px; height: 8px;
      background: #222; border-radius: 4px;
      overflow: hidden; display: none;
    }
    #progress-bar { height: 100%; width: 0; background: #4ade80; transition: width 0.1s; }
    #conn-info { font-size: 0.7rem; color: #333; }
  </style>
</head>
<body>
  <h1>PhotoShare</h1>
  <p class="sub">Send a photo to the desktop</p>

  <div id="status" class="spin">Connecting…</div>

  <img id="preview" alt="Selected photo">

  <!-- Two separate inputs: one forces camera, one opens gallery -->
  <input type="file" id="camera-input"  accept="image/*" capture="environment" style="display:none">
  <input type="file" id="gallery-input" accept="image/*" style="display:none">

  <div class="btn-row" id="pick-row">
    <button class="btn" id="camera-btn">
      <span class="icon">📷</span>Camera
    </button>
    <button class="btn" id="gallery-btn">
      <span class="icon">🖼️</span>Gallery
    </button>
  </div>

  <button id="send-btn" disabled>Send Photo</button>
  <div id="progress-wrap"><div id="progress-bar"></div></div>
  <p id="conn-info"></p>

  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script>
  (() => {
    const statusEl   = document.getElementById('status');
    const cameraBtn  = document.getElementById('camera-btn');
    const galleryBtn = document.getElementById('gallery-btn');
    const pickRow    = document.getElementById('pick-row');
    const sendBtn    = document.getElementById('send-btn');
    const cameraInput  = document.getElementById('camera-input');
    const galleryInput = document.getElementById('gallery-input');
    const preview    = document.getElementById('preview');
    const progressW  = document.getElementById('progress-wrap');
    const progressB  = document.getElementById('progress-bar');
    const connInfo   = document.getElementById('conn-info');

    const CHUNK = 16 * 1024;

    function setStatus(text, cls = '') {
      statusEl.textContent = text;
      statusEl.className   = cls;
    }

    const desktopId = new URLSearchParams(location.search).get('id');
    if (!desktopId) { setStatus('Invalid link — scan the QR again', 'error'); return; }

    const ICE = [
      { urls: 'stun:stun.l.google.com:19302'  },
      { urls: 'stun:stun1.l.google.com:19302' },
      { urls: 'stun:stun.cloudflare.com:3478' },
      { urls: 'turn:openrelay.metered.ca:80',
        username: 'openrelayproject', credential: 'openrelayproject' },
      { urls: 'turn:openrelay.metered.ca:443',
        username: 'openrelayproject', credential: 'openrelayproject' },
      { urls: 'turn:openrelay.metered.ca:443?transport=tcp',
        username: 'openrelayproject', credential: 'openrelayproject' },
    ];

    const peer = new Peer({ config: { iceServers: ICE } });
    let conn, selectedFile;

    peer.on('error', (err) => setStatus(`Error: ${err.type}`, 'error'));

    peer.on('open', () => {
      setStatus('Calling desktop…', 'spin');
      conn = peer.connect(desktopId, { reliable: true, serialization: 'binary' });

      conn.on('open', () => {
        // Show connection type (P2P direct vs TURN relay)
        conn.peerConnection?.getStats().then(stats => {
          stats.forEach(r => {
            if (r.type === 'candidate-pair' && r.state === 'succeeded') {
              const vals   = [...stats.values()];
              const local  = vals.find(s => s.id === r.localCandidateId);
              const remote = vals.find(s => s.id === r.remoteCandidateId);
              if (local && remote) {
                connInfo.textContent =
                  (local.candidateType === 'relay' || remote.candidateType === 'relay')
                    ? '🔄 Relayed via TURN' : '⚡ Direct P2P';
              }
            }
          });
        });

        setStatus('Connected! Choose a photo', 'ready');
        pickRow.style.display = 'flex';   // show Camera + Gallery buttons
      });

      conn.on('error', () => setStatus('Connection error — try again', 'error'));
      conn.on('close',  () => { setStatus('Disconnected', 'error'); pickRow.style.display = 'none'; });
    });

    // ── File selection ──────────────────────────────────────────────────────
    cameraBtn.onclick  = () => cameraInput.click();   // capture="environment" → camera
    galleryBtn.onclick = () => galleryInput.click();  // no capture → gallery picker

    function onFileSelected(file) {
      if (!file) return;
      selectedFile          = file;
      preview.src           = URL.createObjectURL(file);
      preview.style.display = 'block';
      sendBtn.style.display = 'block';
      sendBtn.disabled      = false;
      sendBtn.textContent   = 'Send Photo';
    }

    cameraInput.onchange  = (e) => onFileSelected(e.target.files[0]);
    galleryInput.onchange = (e) => onFileSelected(e.target.files[0]);

    // ── Send via WebRTC data channel (16 KB chunks) ─────────────────────────
    sendBtn.onclick = async () => {
      if (!selectedFile || !conn?.open) return;

      sendBtn.disabled         = true;
      cameraBtn.disabled       = true;
      galleryBtn.disabled      = true;
      progressW.style.display  = 'block';
      progressB.style.width    = '0%';
      setStatus('Sending…', 'sending');

      const buf = await selectedFile.arrayBuffer();

      conn.send(JSON.stringify({
        type: 'meta', name: selectedFile.name,
        size: buf.byteLength, mime: selectedFile.type,
      }));

      const dc = conn.dataChannel;
      let offset = 0;
      while (offset < buf.byteLength) {
        while (dc && dc.bufferedAmount > 512 * 1024)
          await new Promise(r => setTimeout(r, 20));
        const end = Math.min(offset + CHUNK, buf.byteLength);
        conn.send(buf.slice(offset, end));
        offset = end;
        progressB.style.width = Math.round(offset / buf.byteLength * 100) + '%';
      }

      conn.send(JSON.stringify({ type: 'done', name: selectedFile.name, mime: selectedFile.type }));

      setStatus('Sent! ✓', 'done');
      progressW.style.display = 'none';
      sendBtn.textContent     = 'Send Another';
      sendBtn.disabled        = false;
      cameraBtn.disabled      = false;
      galleryBtn.disabled     = false;
    };
  })();
  </script>
</body>
</html>
