<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PhotoShare</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: #fff;
      color: #1a1a1a;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    /* ── Top bar ── */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.9rem 1.5rem;
      flex-shrink: 0;
      border-bottom: 1px solid #f0f0f0;
    }
    .wordmark { font-size: 1.15rem; font-weight: 700; color: #bbb; }

    /* ── Status chip ── */
    #chip {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.45rem 1rem;
      border-radius: 100px;
      font-size: 0.95rem;
      font-weight: 600;
      background: #f4f4f4;
      color: #999;
      transition: background 0.3s, color 0.3s;
    }
    .dot  { width: 8px; height: 8px; border-radius: 50%; background: #ccc; flex-shrink: 0; }
    .ring {
      width: 14px; height: 14px;
      border: 2.5px solid #ddd; border-top-color: #1a73e8;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0; display: none;
    }
    #chip.connecting .dot  { display: none; }
    #chip.connecting .ring { display: block; }
    #chip.connected  { background: #e6f4ea; color: #1a7a35; }
    #chip.connected  .dot { background: #34a853; }
    #chip.sending    { background: #e8f0fe; color: #1a73e8; }
    #chip.sending    .dot { background: #1a73e8; animation: pulse 1s ease-in-out infinite; }
    #chip.done       { background: #e6f4ea; color: #1a7a35; }
    #chip.done       .dot { background: #34a853; }
    #chip.error      { background: #fce8e6; color: #c5221f; }
    #chip.error      .dot { background: #ea4335; }

    @keyframes spin  { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

    /* ── Stage ── */
    .stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      /* paddingBottom set by JS = dock height */
      overflow: hidden;
      text-align: center;
    }

    /* Connecting */
    #v-connecting {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.75rem;
    }
    .big-ring {
      width: 64px; height: 64px;
      border: 5px solid #eee; border-top-color: #1a73e8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    #v-connecting h2 { font-size: 2.2rem; font-weight: 700; color: #333; }
    #v-connecting p  { font-size: 1.3rem; color: #aaa; }

    /* Ready */
    #v-ready {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
    }
    .ready-icon {
      width: 180px; height: 180px;
      background: #eff4ff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .ready-icon svg { width: 90px; height: 90px; fill: #1a73e8; }
    #v-ready h1 {
      font-size: 2.8rem;
      font-weight: 800;
      line-height: 1.15;
      color: #1a1a1a;
    }
    #v-ready p {
      font-size: 1.3rem;
      color: #888;
      line-height: 1.6;
      max-width: 300px;
    }

    /* Preview */
    #v-preview {
      display: none;
      width: 100%;
      flex: 1;
      border-radius: 1.25rem;
      overflow: hidden;
      box-shadow: 0 4px 24px #00000014;
      min-height: 0;
    }
    #v-preview img { width: 100%; height: 100%; object-fit: contain; display: block; background:#f4f4f4; }

    /* ── Live camera viewfinder with framing guide ── */
    #v-camera {
      display: none;
      position: fixed; inset: 0; z-index: 50;
      background: #000;
    }
    #cam { width: 100%; height: 100%; object-fit: cover; display: block; }
    /* Detection overlay shares the video's aspect + object-fit so the quad stays aligned */
    #detect-canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
    .cam-overlay { position: absolute; inset: 0; pointer-events: none; }
    /* dim outside the frame using a big transparent-centre box-shadow */
    .cam-frame {
      position: absolute; top: 14%; left: 7%; right: 7%; bottom: 22%;
      border-radius: 14px;
      box-shadow: 0 0 0 100vmax rgba(0,0,0,0.45);
    }
    .cnr { position: absolute; width: 30px; height: 30px; border: 3px solid #fff; }
    .cnr.tl { top: -2px; left: -2px;  border-right: none; border-bottom: none; border-radius: 12px 0 0 0; }
    .cnr.tr { top: -2px; right: -2px; border-left:  none; border-bottom: none; border-radius: 0 12px 0 0; }
    .cnr.bl { bottom: -2px; left: -2px;  border-right: none; border-top: none; border-radius: 0 0 0 12px; }
    .cnr.br { bottom: -2px; right: -2px; border-left:  none; border-top: none; border-radius: 0 0 12px 0; }
    .cam-hint {
      position: absolute; left: 0; right: 0; top: 5%;
      text-align: center; color: #fff; font-size: 1rem; font-weight: 600;
      padding: 0 1.5rem; text-shadow: 0 1px 4px rgba(0,0,0,0.6); line-height: 1.4;
    }

    /* ── Fixed floating dock ── */
    .dock {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 100;
      background: #fff;
      box-shadow: 0 -1px 12px #00000010;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      padding: 1rem 1.25rem;
      padding-bottom: max(1.25rem, env(safe-area-inset-bottom));
    }

    /* Progress */
    #prog-wrap {
      display: none;
      height: 4px; background: #eee;
      border-radius: 2px; overflow: hidden;
    }
    #prog-bar {
      height: 100%; width: 0;
      background: #1a73e8;
      transition: width 0.1s;
    }

    /* File size */
    #file-sz {
      display: none;
      text-align: center;
      font-size: 1.2rem;
      font-weight: 600;
      color: #bbb;
    }

    /* ── Blue button ── */
    .btn-blue {
      width: 100%;
      border: none;
      border-radius: 100px;
      background: #1a73e8;
      color: #fff;
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: 0.01em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.55rem;
      padding: 0.55em 1.2em;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.1s, background 0.15s;
      box-shadow: 0 4px 18px #1a73e830;
      white-space: nowrap;
    }
    .btn-blue svg {
      /* icon scales with font */
      width: 1em; height: 1em;
      fill: #fff; flex-shrink: 0;
    }
    .btn-blue:active:not(:disabled) { transform: scale(0.97); background: #1558d6; }
    .btn-blue:disabled { opacity: 0.35; cursor: not-allowed; box-shadow: none; }

    /* ── Ghost button ── */
    .btn-ghost {
      width: 100%;
      border: none; background: transparent;
      color: #1a73e8;
      font-size: 1.5rem;
      font-weight: 600;
      padding: 0.4em;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-ghost:active { opacity: 0.6; }
  </style>
</head>
<body>

  <div class="topbar">
    <span class="wordmark">PhotoShare</span>
    <div id="chip" class="connecting">
      <div class="ring"></div>
      <div class="dot"></div>
      <span id="chip-text">Connecting</span>
    </div>
  </div>

  <div class="stage" id="stage">

    <div id="v-connecting">
      <div class="big-ring"></div>
      <h2>Connecting…</h2>
      <p>Reaching your desktop</p>
    </div>

    <div id="v-ready">
      <div class="ready-icon">
        <svg viewBox="0 0 24 24"><path d="M9 3L7.17 5H4C2.9 5 2 5.9 2 7v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2h-3.17L15 3H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg>
      </div>
      <h1>Ready to capture</h1>
      <p>Tap <strong>Capture</strong>, then fit the whole sheet inside the frame — lay it flat, keep all 4 corners visible, avoid shadows.</p>
    </div>

    <div id="v-preview">
      <img id="preview" alt="">
    </div>

  </div>

  <!-- Live camera viewfinder with framing guide (primary capture path) -->
  <div id="v-camera">
    <video id="cam" playsinline autoplay muted></video>
    <canvas id="detect-canvas"></canvas>
    <div class="cam-overlay">
      <div class="cam-frame">
        <span class="cnr tl"></span><span class="cnr tr"></span>
        <span class="cnr bl"></span><span class="cnr br"></span>
      </div>
      <p class="cam-hint" id="cam-hint">Fit the whole sheet inside the frame</p>
    </div>
  </div>

  <!-- Fallback native picker (used if camera permission is denied) -->
  <input type="file" id="camera-input" accept="image/*" capture="environment" style="display:none">

  <div class="dock" id="dock">
    <div id="prog-wrap"><div id="prog-bar"></div></div>
    <span id="file-sz"></span>

    <button class="btn-blue" id="capture-btn" disabled>
      <svg viewBox="0 0 24 24"><path d="M9 3L7.17 5H4C2.9 5 2 5.9 2 7v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2h-3.17L15 3H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg>
      Capture
    </button>

    <button class="btn-blue"  id="shutter-btn"   style="display:none">
      <svg viewBox="0 0 24 24"><path d="M9 3L7.17 5H4C2.9 5 2 5.9 2 7v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2h-3.17L15 3H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg>
      Take Photo
    </button>
    <button class="btn-ghost" id="cancel-btn"   style="display:none">Cancel</button>

    <button class="btn-blue"  id="send-btn"   style="display:none" disabled>Send Photo</button>
    <button class="btn-ghost" id="retake-btn" style="display:none">Retake</button>

    <button class="btn-blue"  id="reconnect-btn" style="display:none">Reconnect</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script>
  (() => {
    const chip        = document.getElementById('chip');
    const chipText    = document.getElementById('chip-text');
    const vConn       = document.getElementById('v-connecting');
    const vReady      = document.getElementById('v-ready');
    const vCamera     = document.getElementById('v-camera');
    const vPreview    = document.getElementById('v-preview');
    const cam         = document.getElementById('cam');
    const preview     = document.getElementById('preview');
    const captureBtn  = document.getElementById('capture-btn');
    const shutterBtn  = document.getElementById('shutter-btn');
    const cancelBtn   = document.getElementById('cancel-btn');
    const sendBtn     = document.getElementById('send-btn');
    const retakeBtn   = document.getElementById('retake-btn');
    const reconnectBtn= document.getElementById('reconnect-btn');
    const camInput    = document.getElementById('camera-input');
    const progWrap    = document.getElementById('prog-wrap');
    const progBar     = document.getElementById('prog-bar');
    const fileSz      = document.getElementById('file-sz');
    const stage       = document.getElementById('stage');
    const dockEl      = document.getElementById('dock');

    const cam2        = document.getElementById('cam');
    const detectCanvas= document.getElementById('detect-canvas');
    const camHint     = document.getElementById('cam-hint');

    const CHUNK = 16 * 1024;
    const MAX_EDGE = 2000;   // downscale long edge before sending
    const JPEG_Q = 0.85;
    const PROC_W = 320;      // detection works on a small downscaled frame
    let conn, selectedFile, stream = null;
    let detecting = false, lastQuad = null, lastConf = 0, detectBusy = false;
    let sentCorners = null;  // page corners (captured-image px) attached to the next send

    function setChip(text, cls) { chipText.textContent = text; chip.className = cls; }
    function buzz(ms) { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} }

    // ── Live page detector (pure JS, in a Web Worker so the camera never janks) ──
    // Returns the 4 corners of the strongest edge cloud, ordered tl,tr,br,bl.
    // Detector: edges → connected components → pick the page's own outline (ignores
    // background clutter, unlike a global extreme-point scan) → 4 corners tl,tr,br,bl.
    const WORKER_SRC = `
      self.onmessage = (e) => {
        const { data, w, h } = e.data, N = w * h;
        const g = new Float32Array(N);
        for (let i = 0, p = 0; i < N; i++, p += 4) g[i] = 0.299*data[p] + 0.587*data[p+1] + 0.114*data[p+2];
        const gb = new Float32Array(N);
        for (let y = 1; y < h-1; y++) for (let x = 1; x < w-1; x++) { const o = y*w+x;
          gb[o] = (g[o-w-1]+g[o-w]+g[o-w+1]+g[o-1]+g[o]+g[o+1]+g[o+w-1]+g[o+w]+g[o+w+1])/9; }
        const mag = new Float32Array(N); let maxM = 0;
        for (let y = 1; y < h-1; y++) for (let x = 1; x < w-1; x++) { const o = y*w+x;
          const gx = -gb[o-w-1]-2*gb[o-1]-gb[o+w-1]+gb[o-w+1]+2*gb[o+1]+gb[o+w+1];
          const gy = -gb[o-w-1]-2*gb[o-w]-gb[o-w+1]+gb[o+w-1]+2*gb[o+w]+gb[o+w+1];
          const m = Math.abs(gx) + Math.abs(gy); mag[o] = m; if (m > maxM) maxM = m; }
        const thr = maxM * 0.16;
        const D = new Uint8Array(N);
        for (let y = 1; y < h-1; y++) for (let x = 1; x < w-1; x++) { const o = y*w+x;
          if (mag[o]>thr||mag[o-1]>thr||mag[o+1]>thr||mag[o-w]>thr||mag[o+w]>thr||mag[o-w-1]>thr||mag[o-w+1]>thr||mag[o+w-1]>thr||mag[o+w+1]>thr) D[o] = 1; }
        const label = new Int32Array(N), stack = []; let nC = 0, best = null;
        for (let s = 0; s < N; s++) { if (!D[s] || label[s]) continue; nC++;
          let minS=1e9,maxS=-1e9,minD=1e9,maxD=-1e9, tl=null,tr=null,br=null,bl=null, tb=0,bb=0,lb=0,rb=0;
          stack.length = 0; stack.push(s); label[s] = nC;
          while (stack.length) { const o = stack.pop(); const x = o % w, y = (o - x) / w; const su = x+y, di = x-y;
            if (su<minS){minS=su;tl=[x,y];} if (su>maxS){maxS=su;br=[x,y];}
            if (di>maxD){maxD=di;tr=[x,y];} if (di<minD){minD=di;bl=[x,y];}
            if (y<=1)tb=1; if (y>=h-2)bb=1; if (x<=1)lb=1; if (x>=w-2)rb=1;
            for (let dy=-1;dy<=1;dy++) for (let dx=-1;dx<=1;dx++) { const nx=x+dx, ny=y+dy;
              if (nx<0||ny<0||nx>=w||ny>=h) continue; const no = ny*w+nx;
              if (D[no] && !label[no]) { label[no] = nC; stack.push(no); } } }
          const quad = [tl,tr,br,bl]; let a = 0;
          for (let i=0;i<4;i++){ const p1=quad[i],p2=quad[(i+1)%4]; a += p1[0]*p2[1]-p2[0]*p1[1]; }
          const areaFrac = Math.abs(a)/2/N, borders = tb+bb+lb+rb;
          if (areaFrac < 0.10 || areaFrac > 0.92 || borders >= 4) continue;
          const score = areaFrac - 0.10*borders;
          if (!best || score > best.score) best = { quad, areaFrac, score };
        }
        self.postMessage({ quad: best ? best.quad : null, conf: best ? best.areaFrac : 0 });
      };
    `;
    let detWorker = null;
    try { detWorker = new Worker(URL.createObjectURL(new Blob([WORKER_SRC], { type: 'application/javascript' }))); } catch (e) { detWorker = null; }
    if (detWorker) detWorker.onmessage = (e) => { detectBusy = false; onDetectResult(e.data); };

    let procCanvas = document.createElement('canvas');
    function detectTick() {
      if (!detecting) return;
      const vw = cam2.videoWidth, vh = cam2.videoHeight;
      if (detWorker && !detectBusy && vw && vh) {
        const pw = PROC_W, ph = Math.max(1, Math.round(PROC_W * vh / vw));
        procCanvas.width = pw; procCanvas.height = ph;
        if (detectCanvas.width !== pw) { detectCanvas.width = pw; detectCanvas.height = ph; }
        const pctx = procCanvas.getContext('2d', { willReadFrequently: true });
        pctx.drawImage(cam2, 0, 0, pw, ph);
        const img = pctx.getImageData(0, 0, pw, ph);
        detectBusy = true;
        detWorker.postMessage({ data: img.data, w: pw, h: ph }, [img.data.buffer]);
      }
      setTimeout(() => requestAnimationFrame(detectTick), 110); // ~6–8 fps
    }

    function onDetectResult({ quad, conf }) {
      lastQuad = (quad && conf > 0.15) ? quad : null;
      lastConf = conf || 0;
      drawDetect();
      if (camHint) camHint.textContent = lastQuad ? 'Page detected — hold steady' : 'Fit the whole sheet inside the frame';
    }

    function drawDetect() {
      const ctx = detectCanvas.getContext('2d');
      ctx.clearRect(0, 0, detectCanvas.width, detectCanvas.height);
      if (!lastQuad) return;
      const locked = lastConf > 0.30;
      ctx.lineWidth = 3; ctx.lineJoin = 'round';
      ctx.strokeStyle = locked ? '#22c55e' : '#60a5fa';
      ctx.fillStyle   = locked ? 'rgba(34,197,94,0.18)' : 'rgba(96,165,250,0.14)';
      ctx.beginPath(); ctx.moveTo(lastQuad[0][0], lastQuad[0][1]);
      for (let i = 1; i < 4; i++) ctx.lineTo(lastQuad[i][0], lastQuad[i][1]);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      lastQuad.forEach(p => { ctx.beginPath(); ctx.arc(p[0], p[1], 4, 0, 6.283); ctx.fillStyle = ctx.strokeStyle; ctx.fill(); });
    }

    // Show exactly one stage view + the right dock buttons for a mode.
    function setMode(mode) {
      vConn.style.display    = mode === 'connecting' ? 'flex' : 'none';
      vReady.style.display   = mode === 'ready'      ? 'flex' : 'none';
      vCamera.style.display  = mode === 'camera'     ? 'block': 'none';
      vPreview.style.display = mode === 'preview'    ? 'block': 'none';

      captureBtn.style.display   = mode === 'ready'        ? 'flex' : 'none';
      shutterBtn.style.display   = mode === 'camera'       ? 'flex' : 'none';
      cancelBtn.style.display    = mode === 'camera'       ? 'block': 'none';
      sendBtn.style.display      = mode === 'preview'      ? 'block': 'none';
      retakeBtn.style.display    = mode === 'preview'      ? 'block': 'none';
      reconnectBtn.style.display = mode === 'disconnected' ? 'flex' : 'none';
    }

    function fitStage() { stage.style.paddingBottom = dockEl.offsetHeight + 'px'; }
    new ResizeObserver(fitStage).observe(dockEl);
    fitStage();

    const desktopId = new URLSearchParams(location.search).get('id');
    if (!desktopId) {
      setChip('Invalid link', 'error');
      vConn.querySelector('h2').textContent = 'Invalid link';
      vConn.querySelector('p').textContent  = 'Rescan the QR code.';
      return;
    }

    const ICE = [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' },
      { urls: 'stun:stun.cloudflare.com:3478' },
      { urls: 'turn:openrelay.metered.ca:80',
        username: 'openrelayproject', credential: 'openrelayproject' },
      { urls: 'turn:openrelay.metered.ca:443',
        username: 'openrelayproject', credential: 'openrelayproject' },
      { urls: 'turn:openrelay.metered.ca:443?transport=tcp',
        username: 'openrelayproject', credential: 'openrelayproject' },
    ];

    const peer = new Peer({ config: { iceServers: ICE } });
    peer.on('error', () => setChip('Error', 'error'));
    peer.on('open', connectToDesktop);

    function connectToDesktop() {
      setChip('Calling…', 'connecting');
      setMode('connecting');
      conn = peer.connect(desktopId, { reliable: true, serialization: 'binary' });
      conn.on('open', () => { setChip('Connected', 'connected'); setMode('ready'); captureBtn.disabled = false; });
      conn.on('error', () => onDrop('Lost'));
      conn.on('close',  () => onDrop('Disconnected'));
    }
    function onDrop(label) { setChip(label, 'error'); stopCamera(); setMode('disconnected'); }

    reconnectBtn.onclick = () => {
      setChip('Reconnecting…', 'connecting');
      if (peer.disconnected) { peer.reconnect(); peer.once('open', connectToDesktop); }
      else connectToDesktop();
    };

    // ── Live camera capture (with native picker fallback) ──
    async function startCamera() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { camInput.value = ''; camInput.click(); return; }
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' }, width: { ideal: 2560 }, height: { ideal: 1440 } },
          audio: false,
        });
        cam.srcObject = stream;
        await cam.play();
        setMode('camera');
        lastQuad = null; lastConf = 0; detecting = true; requestAnimationFrame(detectTick);
      } catch (e) {
        camInput.value = ''; camInput.click(); // permission denied → native camera
      }
    }
    function stopCamera() {
      detecting = false;
      if (detectCanvas.width) detectCanvas.getContext('2d').clearRect(0, 0, detectCanvas.width, detectCanvas.height);
      if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; } cam.srcObject = null;
    }

    captureBtn.onclick = startCamera;
    cancelBtn.onclick  = () => { stopCamera(); setMode('ready'); };
    retakeBtn.onclick  = startCamera;

    shutterBtn.onclick = () => {
      const vw = cam.videoWidth, vh = cam.videoHeight;
      if (!vw || !vh) return;
      buzz(15);
      const scale = Math.min(1, MAX_EDGE / Math.max(vw, vh));
      const cw = Math.round(vw * scale), ch = Math.round(vh * scale);
      // Map the last detected quad (proc-frame px) → captured-image px, if confident
      if (lastQuad && lastConf > 0.15) {
        const f = cw / PROC_W; // proc and capture are both uniform downscales of the video
        sentCorners = lastQuad.map(p => ({ x: +(p[0] * f).toFixed(1), y: +(p[1] * f).toFixed(1) }));
      } else sentCorners = null;
      const c = document.createElement('canvas'); c.width = cw; c.height = ch;
      c.getContext('2d').drawImage(cam, 0, 0, cw, ch);
      c.toBlob(blob => { stopCamera(); usePhoto(blob, 'photo.jpg'); }, 'image/jpeg', JPEG_Q);
    };

    // Native fallback: downscale the picked file to keep transfers fast.
    camInput.onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      sentCorners = null; // no live detection on the native path
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, MAX_EDGE / Math.max(img.naturalWidth, img.naturalHeight));
        const cw = Math.round(img.naturalWidth * scale), ch = Math.round(img.naturalHeight * scale);
        const c = document.createElement('canvas'); c.width = cw; c.height = ch;
        c.getContext('2d').drawImage(img, 0, 0, cw, ch);
        c.toBlob(blob => usePhoto(blob || file, file.name || 'photo.jpg'), 'image/jpeg', JPEG_Q);
      };
      img.onerror = () => usePhoto(file, file.name || 'photo.jpg');
      img.src = URL.createObjectURL(file);
    };

    function usePhoto(blob, name) {
      selectedFile = new File([blob], name, { type: blob.type || 'image/jpeg' });
      preview.src = URL.createObjectURL(selectedFile);
      stage.style.paddingTop  = '1rem';
      stage.style.paddingLeft = stage.style.paddingRight = '1rem';
      fileSz.style.display = 'block';
      fileSz.textContent   = (selectedFile.size / 1024).toFixed(0) + ' KB';
      sendBtn.disabled     = false;
      sendBtn.textContent  = 'Send Photo';
      setMode('preview');
    }

    sendBtn.onclick = async () => {
      if (!selectedFile || !conn?.open) return;
      sendBtn.disabled   = true;
      retakeBtn.disabled = true;
      progWrap.style.display = 'block';
      progBar.style.width    = '0%';
      setChip('Sending…', 'sending');

      const buf = await selectedFile.arrayBuffer();
      conn.send(JSON.stringify({
        type: 'meta', name: selectedFile.name,
        size: buf.byteLength, mime: selectedFile.type,
        corners: sentCorners,   // live-detected page corners (captured-image px), or null
      }));

      const dc = conn.dataChannel;
      let offset = 0;
      while (offset < buf.byteLength) {
        while (dc && dc.bufferedAmount > 512 * 1024)
          await new Promise(r => setTimeout(r, 20));
        const end = Math.min(offset + CHUNK, buf.byteLength);
        conn.send(buf.slice(offset, end));
        offset = end;
        progBar.style.width = Math.round(offset / buf.byteLength * 100) + '%';
      }
      conn.send(JSON.stringify({ type: 'done', name: selectedFile.name, mime: selectedFile.type }));

      buzz([20, 40, 20]);
      setChip('Sent ✓', 'done');
      progWrap.style.display = 'none';
      sendBtn.textContent    = 'Send Another';
      sendBtn.disabled       = false;
      retakeBtn.disabled     = false;
    };
  })();
  </script>
</body>
</html>
