<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>PhotoShare</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: #fff;
      color: #202124;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.25rem 1.5rem;
      flex-shrink: 0;
    }

    .wordmark {
      font-size: 1.15rem;
      font-weight: 500;
      color: #202124;
      letter-spacing: -0.01em;
    }

    /* ── Status chip ── */
    #status {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.45rem 1rem;
      border-radius: 100px;
      font-size: 0.82rem;
      font-weight: 500;
      background: #f1f3f4;
      color: #5f6368;
      transition: background 0.3s, color 0.3s;
    }
    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #bdc1c6;
      flex-shrink: 0;
      transition: background 0.3s;
    }
    .ring {
      width: 14px; height: 14px;
      border: 2px solid #dadce0;
      border-top-color: #1a73e8;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      flex-shrink: 0;
      display: none;
    }
    #status.connecting .dot  { display: none; }
    #status.connecting .ring { display: block; }
    #status.connected  { background: #e6f4ea; color: #137333; }
    #status.connected  .dot  { background: #34a853; }
    #status.sending    { background: #e8f0fe; color: #1a73e8; }
    #status.sending    .dot  { background: #1a73e8; animation: pulse 1s ease-in-out infinite; }
    #status.done       { background: #e6f4ea; color: #137333; }
    #status.done       .dot  { background: #34a853; }
    #status.error      { background: #fce8e6; color: #c5221f; }
    #status.error      .dot  { background: #ea4335; }

    @keyframes spin  { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.35; } }

    /* ── Preview area ── */
    .preview-area {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #f8f9fa;
    }

    #preview {
      display: none;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      color: #dadce0;
      user-select: none;
    }
    .placeholder svg  { width: 72px; height: 72px; }
    .placeholder span { font-size: 0.85rem; color: #bdc1c6; }

    /* ── Bottom dock ── */
    .dock {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
      padding: 1.75rem 1.5rem;
      padding-bottom: max(1.75rem, env(safe-area-inset-bottom));
      background: #fff;
    }

    /* Progress bar */
    #prog-wrap {
      display: none;
      width: 100%;
      height: 3px;
      background: #e8eaed;
      border-radius: 2px;
      overflow: hidden;
    }
    #prog-bar {
      height: 100%;
      width: 0;
      background: #1a73e8;
      border-radius: 2px;
      transition: width 0.1s;
    }

    /* File size label */
    #file-label {
      display: none;
      font-size: 0.8rem;
      color: #9aa0a6;
      letter-spacing: 0.01em;
    }

    /* ── Shutter button ── */
    #shutter {
      width: 80px; height: 80px;
      border-radius: 50%;
      border: 3.5px solid #dadce0;
      background: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.12s, border-color 0.2s;
      flex-shrink: 0;
      box-shadow: 0 1px 4px #0001;
    }
    #shutter:active:not(:disabled)  { transform: scale(0.91); }
    #shutter:disabled { opacity: 0.35; cursor: not-allowed; }

    .shutter-core {
      width: 62px; height: 62px;
      border-radius: 50%;
      background: #202124;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    #shutter:not(:disabled):active .shutter-core { background: #1a73e8; }
    .shutter-core svg { width: 30px; height: 30px; fill: #fff; }

    /* ── Send / retake row ── */
    #action-row {
      display: none;
      width: 100%;
      gap: 0.75rem;
      flex-direction: column;
    }

    #send-btn {
      width: 100%;
      min-height: 56px;
      border: none;
      border-radius: 100px;
      background: #1a73e8;
      color: #fff;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      letter-spacing: 0.01em;
      transition: background 0.15s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }
    #send-btn:active:not(:disabled) { background: #1558d6; transform: scale(0.98); }
    #send-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    #retake-btn {
      width: 100%;
      min-height: 44px;
      border: none;
      border-radius: 100px;
      background: transparent;
      color: #5f6368;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      letter-spacing: 0.01em;
      -webkit-tap-highlight-color: transparent;
    }
    #retake-btn:active { opacity: 0.6; }

    /* ── Media queries ── */
    @media (min-height: 700px) {
      #shutter { width: 96px; height: 96px; }
      .shutter-core { width: 76px; height: 76px; }
      .shutter-core svg { width: 36px; height: 36px; }
      .dock { gap: 1.5rem; padding: 2rem 1.5rem; padding-bottom: max(2rem, env(safe-area-inset-bottom)); }
      #send-btn { min-height: 60px; font-size: 1.05rem; }
    }

    @media (min-height: 800px) {
      #shutter { width: 112px; height: 112px; border-width: 4px; }
      .shutter-core { width: 90px; height: 90px; }
      .shutter-core svg { width: 42px; height: 42px; }
      .dock { gap: 1.75rem; padding: 2.25rem 2rem; padding-bottom: max(2.25rem, env(safe-area-inset-bottom)); }
      header { padding: 1.5rem 2rem; }
      .placeholder svg { width: 90px; height: 90px; }
    }

    @media (min-width: 400px) {
      header { padding: 1.5rem 2rem; }
      .dock { padding-left: 2rem; padding-right: 2rem; }
    }
  </style>
</head>
<body>

  <header>
    <span class="wordmark">PhotoShare</span>
    <div id="status" class="connecting">
      <div class="ring"></div>
      <div class="dot"></div>
      <span id="status-text">Connecting</span>
    </div>
  </header>

  <div class="preview-area">
    <div class="placeholder" id="placeholder">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M9 3L7.17 5H4C2.9 5 2 5.9 2 7v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2h-3.17L15 3H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/>
        <circle cx="12" cy="13" r="2.5" opacity=".55"/>
      </svg>
      <span>Tap the button to take a photo</span>
    </div>
    <img id="preview" alt="">
  </div>

  <input type="file" id="camera-input" accept="image/*" capture="environment" style="display:none">

  <div class="dock">
    <div id="prog-wrap"><div id="prog-bar"></div></div>

    <span id="file-label"></span>

    <button id="shutter" disabled>
      <div class="shutter-core">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M9 3L7.17 5H4C2.9 5 2 5.9 2 7v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2h-3.17L15 3H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/>
        </svg>
      </div>
    </button>

    <div id="action-row">
      <button id="send-btn">Send Photo</button>
      <button id="retake-btn">Retake</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script>
  (() => {
    const statusEl    = document.getElementById('status');
    const statusText  = document.getElementById('status-text');
    const shutter     = document.getElementById('shutter');
    const sendBtn     = document.getElementById('send-btn');
    const retakeBtn   = document.getElementById('retake-btn');
    const camInput    = document.getElementById('camera-input');
    const preview     = document.getElementById('preview');
    const placeholder = document.getElementById('placeholder');
    const progWrap    = document.getElementById('prog-wrap');
    const progBar     = document.getElementById('prog-bar');
    const actionRow   = document.getElementById('action-row');
    const fileLabel   = document.getElementById('file-label');

    const CHUNK = 16 * 1024;
    let conn, selectedFile;

    function setStatus(text, cls) {
      statusText.textContent = text;
      statusEl.className = cls;
    }

    const desktopId = new URLSearchParams(location.search).get('id');
    if (!desktopId) { setStatus('Invalid link — rescan QR', 'error'); return; }

    const ICE = [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' },
      { urls: 'stun:stun.cloudflare.com:3478' },
      { urls: 'turn:openrelay.metered.ca:80',
        username: 'openrelayproject', credential: 'openrelayproject' },
      { urls: 'turn:openrelay.metered.ca:443',
        username: 'openrelayproject', credential: 'openrelayproject' },
      { urls: 'turn:openrelay.metered.ca:443?transport=tcp',
        username: 'openrelayproject', credential: 'openrelayproject' },
    ];

    const peer = new Peer({ config: { iceServers: ICE } });
    peer.on('error', () => setStatus('Error', 'error'));

    peer.on('open', () => {
      setStatus('Calling…', 'connecting');
      conn = peer.connect(desktopId, { reliable: true, serialization: 'binary' });

      conn.on('open', () => {
        setStatus('Connected', 'connected');
        shutter.disabled = false;
      });
      conn.on('error', () => { setStatus('Lost connection', 'error'); shutter.disabled = true; });
      conn.on('close',  () => { setStatus('Disconnected', 'error');   shutter.disabled = true; });
    });

    // ── Capture ──────────────────────────────────────────────────────────────
    shutter.onclick = () => camInput.click();

    retakeBtn.onclick = () => {
      camInput.value = '';
      camInput.click();
    };

    camInput.onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      selectedFile = file;

      const url = URL.createObjectURL(file);
      preview.src           = url;
      preview.style.display = 'block';
      placeholder.style.display = 'none';

      fileLabel.textContent  = `${(file.size / 1024).toFixed(0)} KB`;
      fileLabel.style.display = 'block';

      shutter.style.display      = 'none';
      actionRow.style.display    = 'flex';
      sendBtn.disabled           = false;
      sendBtn.textContent        = 'Send Photo';
    };

    // ── Send ─────────────────────────────────────────────────────────────────
    sendBtn.onclick = async () => {
      if (!selectedFile || !conn?.open) return;

      sendBtn.disabled  = true;
      retakeBtn.disabled = true;
      progWrap.style.display = 'block';
      progBar.style.width    = '0%';
      setStatus('Sending…', 'sending');

      const buf = await selectedFile.arrayBuffer();

      conn.send(JSON.stringify({
        type: 'meta', name: selectedFile.name,
        size: buf.byteLength, mime: selectedFile.type,
      }));

      const dc = conn.dataChannel;
      let offset = 0;
      while (offset < buf.byteLength) {
        while (dc && dc.bufferedAmount > 512 * 1024)
          await new Promise(r => setTimeout(r, 20));
        const end = Math.min(offset + CHUNK, buf.byteLength);
        conn.send(buf.slice(offset, end));
        offset = end;
        progBar.style.width = Math.round(offset / buf.byteLength * 100) + '%';
      }

      conn.send(JSON.stringify({ type: 'done', name: selectedFile.name, mime: selectedFile.type }));

      setStatus('Sent ✓', 'done');
      progWrap.style.display = 'none';
      sendBtn.textContent    = 'Send Another';
      sendBtn.disabled       = false;
      retakeBtn.disabled     = false;
    };
  })();
  </script>
</body>
</html>
