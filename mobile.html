<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PhotoShare</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: #fff;
      color: #1a1a1a;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    /* ── Top bar ── */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.9rem 1.5rem;
      flex-shrink: 0;
      border-bottom: 1px solid #f0f0f0;
    }
    .wordmark { font-size: 1.15rem; font-weight: 700; color: #bbb; }

    /* ── Status chip ── */
    #chip {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.45rem 1rem;
      border-radius: 100px;
      font-size: 0.95rem;
      font-weight: 600;
      background: #f4f4f4;
      color: #999;
      transition: background 0.3s, color 0.3s;
    }
    .dot  { width: 8px; height: 8px; border-radius: 50%; background: #ccc; flex-shrink: 0; }
    .ring {
      width: 14px; height: 14px;
      border: 2.5px solid #ddd; border-top-color: #1a73e8;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0; display: none;
    }
    #chip.connecting .dot  { display: none; }
    #chip.connecting .ring { display: block; }
    #chip.connected  { background: #e6f4ea; color: #1a7a35; }
    #chip.connected  .dot { background: #34a853; }
    #chip.sending    { background: #e8f0fe; color: #1a73e8; }
    #chip.sending    .dot { background: #1a73e8; animation: pulse 1s ease-in-out infinite; }
    #chip.done       { background: #e6f4ea; color: #1a7a35; }
    #chip.done       .dot { background: #34a853; }
    #chip.error      { background: #fce8e6; color: #c5221f; }
    #chip.error      .dot { background: #ea4335; }

    @keyframes spin  { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

    /* ── Stage ── */
    .stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      /* paddingBottom set by JS = dock height */
      overflow: hidden;
      text-align: center;
    }

    /* Connecting */
    #v-connecting {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.75rem;
    }
    .big-ring {
      width: 64px; height: 64px;
      border: 5px solid #eee; border-top-color: #1a73e8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    #v-connecting h2 { font-size: 2.2rem; font-weight: 700; color: #333; }
    #v-connecting p  { font-size: 1.3rem; color: #aaa; }

    /* Ready */
    #v-ready {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
    }
    .ready-icon {
      width: 180px; height: 180px;
      background: #eff4ff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .ready-icon svg { width: 90px; height: 90px; fill: #1a73e8; }
    #v-ready h1 {
      font-size: 2.8rem;
      font-weight: 800;
      line-height: 1.15;
      color: #1a1a1a;
    }
    #v-ready p {
      font-size: 1.3rem;
      color: #888;
      line-height: 1.6;
      max-width: 300px;
    }

    /* Preview */
    #v-preview {
      display: none;
      width: 100%;
      flex: 1;
      border-radius: 1.25rem;
      overflow: hidden;
      box-shadow: 0 4px 24px #00000014;
      min-height: 0;
    }
    #v-preview img { width: 100%; height: 100%; object-fit: cover; display: block; }

    /* ── Fixed floating dock ── */
    .dock {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 100;
      background: #fff;
      box-shadow: 0 -1px 12px #00000010;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      padding: 1rem 1.25rem;
      padding-bottom: max(1.25rem, env(safe-area-inset-bottom));
    }

    /* Progress */
    #prog-wrap {
      display: none;
      height: 4px; background: #eee;
      border-radius: 2px; overflow: hidden;
    }
    #prog-bar {
      height: 100%; width: 0;
      background: #1a73e8;
      transition: width 0.1s;
    }

    /* File size */
    #file-sz {
      display: none;
      text-align: center;
      font-size: 1.2rem;
      font-weight: 600;
      color: #bbb;
    }

    /* ── Blue button ── */
    .btn-blue {
      width: 100%;
      border: none;
      border-radius: 100px;
      background: #1a73e8;
      color: #fff;
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: 0.01em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.55rem;
      padding: 0.55em 1.2em;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.1s, background 0.15s;
      box-shadow: 0 4px 18px #1a73e830;
      white-space: nowrap;
    }
    .btn-blue svg {
      /* icon scales with font */
      width: 1em; height: 1em;
      fill: #fff; flex-shrink: 0;
    }
    .btn-blue:active:not(:disabled) { transform: scale(0.97); background: #1558d6; }
    .btn-blue:disabled { opacity: 0.35; cursor: not-allowed; box-shadow: none; }

    /* ── Ghost button ── */
    .btn-ghost {
      width: 100%;
      border: none; background: transparent;
      color: #1a73e8;
      font-size: 1.5rem;
      font-weight: 600;
      padding: 0.4em;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-ghost:active { opacity: 0.6; }
  </style>
</head>
<body>

  <div class="topbar">
    <span class="wordmark">PhotoShare</span>
    <div id="chip" class="connecting">
      <div class="ring"></div>
      <div class="dot"></div>
      <span id="chip-text">Connecting</span>
    </div>
  </div>

  <div class="stage" id="stage">

    <div id="v-connecting">
      <div class="big-ring"></div>
      <h2>Connecting…</h2>
      <p>Reaching your desktop</p>
    </div>

    <div id="v-ready">
      <div class="ready-icon">
        <svg viewBox="0 0 24 24"><path d="M9 3L7.17 5H4C2.9 5 2 5.9 2 7v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2h-3.17L15 3H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg>
      </div>
      <h1>Ready to capture</h1>
      <p>Tap the button and point your camera at what you want to send</p>
    </div>

    <div id="v-preview">
      <img id="preview" alt="">
    </div>

  </div>

  <input type="file" id="camera-input" accept="image/*" capture="environment" style="display:none">

  <div class="dock" id="dock">
    <div id="prog-wrap"><div id="prog-bar"></div></div>
    <span id="file-sz"></span>

    <button class="btn-blue" id="capture-btn" disabled>
      <svg viewBox="0 0 24 24"><path d="M9 3L7.17 5H4C2.9 5 2 5.9 2 7v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2h-3.17L15 3H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg>
      Capture
    </button>

    <button class="btn-blue"  id="send-btn"   style="display:none" disabled>Send Photo</button>
    <button class="btn-ghost" id="retake-btn" style="display:none">Retake</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script>
  (() => {
    const chip        = document.getElementById('chip');
    const chipText    = document.getElementById('chip-text');
    const vConn       = document.getElementById('v-connecting');
    const vReady      = document.getElementById('v-ready');
    const vPreview    = document.getElementById('v-preview');
    const preview     = document.getElementById('preview');
    const captureBtn  = document.getElementById('capture-btn');
    const sendBtn     = document.getElementById('send-btn');
    const retakeBtn   = document.getElementById('retake-btn');
    const camInput    = document.getElementById('camera-input');
    const progWrap    = document.getElementById('prog-wrap');
    const progBar     = document.getElementById('prog-bar');
    const fileSz      = document.getElementById('file-sz');
    const stage       = document.getElementById('stage');
    const dockEl      = document.getElementById('dock');

    const CHUNK = 16 * 1024;
    let conn, selectedFile;

    function setChip(text, cls) { chipText.textContent = text; chip.className = cls; }

    // Keep stage bottom-padding == dock height so content never hides under dock
    function fitStage() {
      stage.style.paddingBottom = dockEl.offsetHeight + 'px';
    }
    new ResizeObserver(fitStage).observe(dockEl);
    fitStage();

    const desktopId = new URLSearchParams(location.search).get('id');
    if (!desktopId) {
      setChip('Invalid link', 'error');
      vConn.querySelector('h2').textContent = 'Invalid link';
      vConn.querySelector('p').textContent  = 'Rescan the QR code.';
      return;
    }

    const ICE = [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' },
      { urls: 'stun:stun.cloudflare.com:3478' },
      { urls: 'turn:openrelay.metered.ca:80',
        username: 'openrelayproject', credential: 'openrelayproject' },
      { urls: 'turn:openrelay.metered.ca:443',
        username: 'openrelayproject', credential: 'openrelayproject' },
      { urls: 'turn:openrelay.metered.ca:443?transport=tcp',
        username: 'openrelayproject', credential: 'openrelayproject' },
    ];

    const peer = new Peer({ config: { iceServers: ICE } });
    peer.on('error', () => setChip('Error', 'error'));

    peer.on('open', () => {
      setChip('Calling…', 'connecting');
      conn = peer.connect(desktopId, { reliable: true, serialization: 'binary' });

      conn.on('open', () => {
        setChip('Connected', 'connected');
        vConn.style.display  = 'none';
        vReady.style.display = 'flex';
        captureBtn.disabled  = false;
      });
      conn.on('error', () => { setChip('Lost', 'error'); captureBtn.disabled = true; });
      conn.on('close',  () => { setChip('Disconnected', 'error'); captureBtn.disabled = true; });
    });

    captureBtn.onclick = () => camInput.click();
    retakeBtn.onclick  = () => { camInput.value = ''; camInput.click(); };

    camInput.onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      selectedFile = file;
      preview.src = URL.createObjectURL(file);

      vReady.style.display    = 'none';
      vPreview.style.display  = 'block';
      stage.style.paddingTop  = '1rem';
      stage.style.paddingLeft = stage.style.paddingRight = '1rem';

      captureBtn.style.display = 'none';
      fileSz.style.display     = 'block';
      fileSz.textContent       = (file.size / 1024).toFixed(0) + ' KB';
      sendBtn.style.display    = 'block';
      retakeBtn.style.display  = 'block';
      sendBtn.disabled         = false;
      sendBtn.textContent      = 'Send Photo';
    };

    sendBtn.onclick = async () => {
      if (!selectedFile || !conn?.open) return;
      sendBtn.disabled   = true;
      retakeBtn.disabled = true;
      progWrap.style.display = 'block';
      progBar.style.width    = '0%';
      setChip('Sending…', 'sending');

      const buf = await selectedFile.arrayBuffer();
      conn.send(JSON.stringify({
        type: 'meta', name: selectedFile.name,
        size: buf.byteLength, mime: selectedFile.type,
      }));

      const dc = conn.dataChannel;
      let offset = 0;
      while (offset < buf.byteLength) {
        while (dc && dc.bufferedAmount > 512 * 1024)
          await new Promise(r => setTimeout(r, 20));
        const end = Math.min(offset + CHUNK, buf.byteLength);
        conn.send(buf.slice(offset, end));
        offset = end;
        progBar.style.width = Math.round(offset / buf.byteLength * 100) + '%';
      }
      conn.send(JSON.stringify({ type: 'done', name: selectedFile.name, mime: selectedFile.type }));

      setChip('Sent ✓', 'done');
      progWrap.style.display = 'none';
      sendBtn.textContent    = 'Send Another';
      sendBtn.disabled       = false;
      retakeBtn.disabled     = false;
    };
  })();
  </script>
</body>
</html>
